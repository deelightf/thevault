<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Storage</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            max-width: 800px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
        }

        .login-screen, .main-screen {
            display: none;
        }

        .login-screen.active, .main-screen.active {
            display: block;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
        }

        input[type="password"],
        input[type="text"],
        textarea,
        input[type="file"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            font-weight: 600;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: #6c757d;
            margin-left: 10px;
        }

        .btn-danger {
            background: #dc3545;
        }

        .error {
            color: #dc3545;
            margin-top: 10px;
            font-size: 14px;
        }

        .success {
            color: #28a745;
            margin-top: 10px;
            font-size: 14px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            border-bottom: 2px solid #eee;
        }

        .tab {
            padding: 12px 24px;
            background: none;
            border: none;
            border-bottom: 3px solid transparent;
            cursor: pointer;
            font-weight: 600;
            color: #666;
            transition: all 0.3s;
        }

        .tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .file-list, .message-list {
            margin-top: 20px;
        }

        .file-item, .message-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .file-info, .message-info {
            flex: 1;
        }

        .file-name, .message-title {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }

        .file-meta, .message-meta {
            font-size: 12px;
            color: #666;
        }

        .file-actions, .message-actions {
            display: flex;
            gap: 10px;
        }

        .btn-small {
            padding: 8px 16px;
            font-size: 14px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 12px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            margin-bottom: 20px;
        }

        .modal-header h2 {
            color: #333;
        }

        .logout-btn {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Login Screen -->
        <div class="login-screen active" id="loginScreen">
            <!-- Content will be dynamically loaded based on first-time or returning user -->
        </div>

        <!-- Main Screen -->
        <div class="main-screen" id="mainScreen">
            <h1>🔐 Secure Storage Dashboard</h1>
            
            <div class="tabs">
                <button class="tab active" onclick="switchTab('files')">Files</button>
                <button class="tab" onclick="switchTab('messages')">Messages</button>
                <button class="tab" onclick="switchTab('add')">Add New</button>
            </div>

            <!-- Files Tab -->
            <div class="tab-content active" id="filesTab">
                <h2>Encrypted Files</h2>
                <div class="file-list" id="fileList"></div>
            </div>

            <!-- Messages Tab -->
            <div class="tab-content" id="messagesTab">
                <h2>Encrypted Messages</h2>
                <div class="message-list" id="messageList"></div>
            </div>

            <!-- Add New Tab -->
            <div class="tab-content" id="addTab">
                <h2>Add New Item</h2>
                
                <div class="input-group">
                    <label>Type</label>
                    <select id="addType" onchange="toggleAddForm()" style="width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 6px;">
                        <option value="file">File</option>
                        <option value="message">Message</option>
                    </select>
                </div>

                <div id="fileForm">
                    <div class="input-group">
                        <label for="fileInput">Select File</label>
                        <input type="file" id="fileInput">
                    </div>
                </div>

                <div id="messageForm" style="display: none;">
                    <div class="input-group">
                        <label for="messageTitle">Message Title</label>
                        <input type="text" id="messageTitle" placeholder="Enter message title">
                    </div>
                    <div class="input-group">
                        <label for="messageContent">Message Content</label>
                        <textarea id="messageContent" placeholder="Enter your message"></textarea>
                    </div>
                </div>

                <div class="input-group">
                    <label for="itemPassphrase">Passphrase</label>
                    <input type="password" id="itemPassphrase" placeholder="Enter passphrase for this item">
                </div>

                <button onclick="addItem()">Encrypt & Store</button>
                <div class="success" id="addSuccess"></div>
                <div class="error" id="addError"></div>
            </div>

            <button class="logout-btn btn-secondary" onclick="logout()">Logout</button>
        </div>
    </div>

    <!-- Passphrase Modal -->
    <div class="modal" id="passphraseModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Enter Passphrase</h2>
            </div>
            <div class="input-group">
                <label for="modalPassphrase">Passphrase</label>
                <input type="password" id="modalPassphrase" placeholder="Enter passphrase to decrypt">
            </div>
            <button onclick="decryptItem()">Decrypt</button>
            <button class="btn-secondary" onclick="closeModal()">Cancel</button>
            <div class="error" id="modalError"></div>
        </div>
    </div>

    <script>
        // Security: Master password is used to encrypt a verification token
        // Without the correct password, you cannot decrypt the token to gain access
        // Even if someone modifies the code, they cannot decrypt the stored data without the password
        let masterPassword = null;
        let currentItem = null;
        let isFirstTime = !localStorage.getItem('authToken');

        // Initialize
        function init() {
            if (isFirstTime) {
                showSetupScreen();
            } else {
                showLoginScreen();
            }
            loadItems();
        }

        // Show login screen for returning users
        function showLoginScreen() {
            document.getElementById('loginScreen').innerHTML = `
                <h1>🔒 Secure Storage</h1>
                <div class="input-group">
                    <label for="masterPassword">Master Password</label>
                    <input type="password" id="masterPassword" placeholder="Enter your master password">
                </div>
                <button onclick="login()">Login</button>
                <div class="error" id="loginError"></div>
            `;
        }

        // Show setup screen for first time users
        function showSetupScreen() {
            document.getElementById('loginScreen').innerHTML = `
                <h1>🔒 First Time Setup</h1>
                <p style="color: #666; margin-bottom: 20px;">Create your master password. This password will encrypt all your data.</p>
                <div class="input-group">
                    <label for="setupPassword">Master Password</label>
                    <input type="password" id="setupPassword" placeholder="Enter a strong password">
                </div>
                <div class="input-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" placeholder="Confirm your password">
                </div>
                <button onclick="setupMasterPassword()">Create Master Password</button>
                <div class="error" id="loginError"></div>
                <p style="color: #dc3545; font-size: 12px; margin-top: 15px;"><strong>WARNING:</strong> If you forget this password, your data cannot be recovered!</p>
            `;
        }

        // Setup master password (first time only)
        async function setupMasterPassword() {
            const password = document.getElementById('setupPassword').value;
            const confirm = document.getElementById('confirmPassword').value;
            const errorEl = document.getElementById('loginError');

            if (!password || password.length < 8) {
                errorEl.textContent = 'Password must be at least 8 characters';
                return;
            }

            if (password !== confirm) {
                errorEl.textContent = 'Passwords do not match';
                return;
            }

            try {
                // Create an encrypted authentication token
                const authToken = 'AUTHENTICATED_' + Math.random();
                const encryptedToken = await encryptData(authToken, password);
                localStorage.setItem('authToken', encryptedToken);
                
                // Show success and redirect to login
                alert('Master password created successfully! Please login.');
                location.reload();
            } catch (err) {
                errorEl.textContent = 'Error setting up password';
            }
        }

        // Login - verify by attempting to decrypt the auth token
        async function login() {
            const password = document.getElementById('masterPassword').value;
            const errorEl = document.getElementById('loginError');
            
            if (!password) {
                errorEl.textContent = 'Please enter your password';
                return;
            }

            try {
                // Try to decrypt the authentication token
                const encryptedToken = localStorage.getItem('authToken');
                const decryptedToken = await decryptData(encryptedToken, password);
                
                // If decryption succeeds and token is valid, password is correct
                if (decryptedToken && decryptedToken.startsWith('AUTHENTICATED_')) {
                    masterPassword = password;
                    document.getElementById('loginScreen').classList.remove('active');
                    document.getElementById('mainScreen').classList.add('active');
                    errorEl.textContent = '';
                    loadItems();
                } else {
                    errorEl.textContent = 'Incorrect password';
                }
            } catch (err) {
                errorEl.textContent = 'Incorrect password';
            }
        }

        // Logout
        function logout() {
            document.getElementById('loginScreen').classList.add('active');
            document.getElementById('mainScreen').classList.remove('active');
            document.getElementById('masterPassword').value = '';
        }

        // Tab Switching
        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(tab + 'Tab').classList.add('active');
            
            if (tab === 'files' || tab === 'messages') {
                loadItems();
            }
        }

        // Toggle Add Form
        function toggleAddForm() {
            const type = document.getElementById('addType').value;
            document.getElementById('fileForm').style.display = type === 'file' ? 'block' : 'none';
            document.getElementById('messageForm').style.display = type === 'message' ? 'block' : 'none';
        }

        // Encryption/Decryption Functions
        async function encryptData(data, passphrase) {
            const encoder = new TextEncoder();
            const salt = crypto.getRandomValues(new Uint8Array(16));
            
            const keyMaterial = await crypto.subtle.importKey(
                'raw',
                encoder.encode(passphrase),
                'PBKDF2',
                false,
                ['deriveBits', 'deriveKey']
            );
            
            const key = await crypto.subtle.deriveKey(
                {
                    name: 'PBKDF2',
                    salt: salt,
                    iterations: 100000,
                    hash: 'SHA-256'
                },
                keyMaterial,
                { name: 'AES-GCM', length: 256 },
                false,
                ['encrypt', 'decrypt']
            );
            
            const iv = crypto.getRandomValues(new Uint8Array(12));
            const encryptedData = await crypto.subtle.encrypt(
                { name: 'AES-GCM', iv: iv },
                key,
                encoder.encode(data)
            );
            
            const encryptedArray = new Uint8Array(encryptedData);
            const combined = new Uint8Array(salt.length + iv.length + encryptedArray.length);
            combined.set(salt, 0);
            combined.set(iv, salt.length);
            combined.set(encryptedArray, salt.length + iv.length);
            
            return btoa(String.fromCharCode(...combined));
        }

        async function decryptData(encryptedData, passphrase) {
            const decoder = new TextDecoder();
            const encoder = new TextEncoder();
            
            const combined = Uint8Array.from(atob(encryptedData), c => c.charCodeAt(0));
            const salt = combined.slice(0, 16);
            const iv = combined.slice(16, 28);
            const data = combined.slice(28);
            
            const keyMaterial = await crypto.subtle.importKey(
                'raw',
                encoder.encode(passphrase),
                'PBKDF2',
                false,
                ['deriveBits', 'deriveKey']
            );
            
            const key = await crypto.subtle.deriveKey(
                {
                    name: 'PBKDF2',
                    salt: salt,
                    iterations: 100000,
                    hash: 'SHA-256'
                },
                keyMaterial,
                { name: 'AES-GCM', length: 256 },
                false,
                ['encrypt', 'decrypt']
            );
            
            const decryptedData = await crypto.subtle.decrypt(
                { name: 'AES-GCM', iv: iv },
                key,
                data
            );
            
            return decoder.decode(decryptedData);
        }

        // Add Item
        async function addItem() {
            const type = document.getElementById('addType').value;
            const passphrase = document.getElementById('itemPassphrase').value;
            const successEl = document.getElementById('addSuccess');
            const errorEl = document.getElementById('addError');
            
            successEl.textContent = '';
            errorEl.textContent = '';
            
            if (!passphrase) {
                errorEl.textContent = 'Please enter a passphrase';
                return;
            }
            
            try {
                let item = { type, timestamp: Date.now() };
                
                if (type === 'file') {
                    const fileInput = document.getElementById('fileInput');
                    if (!fileInput.files[0]) {
                        errorEl.textContent = 'Please select a file';
                        return;
                    }
                    
                    const file = fileInput.files[0];
                    const reader = new FileReader();
                    
                    reader.onload = async (e) => {
                        const fileData = e.target.result;
                        item.name = file.name;
                        item.size = file.size;
                        item.encryptedData = await encryptData(fileData, passphrase);
                        
                        saveItem(item);
                        successEl.textContent = 'File encrypted and stored successfully!';
                        fileInput.value = '';
                        document.getElementById('itemPassphrase').value = '';
                    };
                    
                    reader.readAsDataURL(file);
                } else {
                    const title = document.getElementById('messageTitle').value;
                    const content = document.getElementById('messageContent').value;
                    
                    if (!title || !content) {
                        errorEl.textContent = 'Please enter both title and content';
                        return;
                    }
                    
                    item.title = title;
                    item.encryptedData = await encryptData(content, passphrase);
                    
                    saveItem(item);
                    successEl.textContent = 'Message encrypted and stored successfully!';
                    document.getElementById('messageTitle').value = '';
                    document.getElementById('messageContent').value = '';
                    document.getElementById('itemPassphrase').value = '';
                }
            } catch (err) {
                errorEl.textContent = 'Error encrypting item: ' + err.message;
            }
        }

        // Save Item to memory
        function saveItem(item) {
            const items = JSON.parse(localStorage.getItem('encryptedItems') || '[]');
            item.id = Date.now() + Math.random();
            items.push(item);
            localStorage.setItem('encryptedItems', JSON.stringify(items));
            loadItems();
        }

        // Load Items
        function loadItems() {
            const items = JSON.parse(localStorage.getItem('encryptedItems') || '[]');
            
            const fileList = document.getElementById('fileList');
            const messageList = document.getElementById('messageList');
            
            fileList.innerHTML = '';
            messageList.innerHTML = '';
            
            const files = items.filter(i => i.type === 'file');
            const messages = items.filter(i => i.type === 'message');
            
            if (files.length === 0) {
                fileList.innerHTML = '<p style="color: #666;">No encrypted files stored yet.</p>';
            } else {
                files.forEach(file => {
                    const fileEl = document.createElement('div');
                    fileEl.className = 'file-item';
                    fileEl.innerHTML = `
                        <div class="file-info">
                            <div class="file-name">📄 ${file.name}</div>
                            <div class="file-meta">${formatBytes(file.size)} • ${formatDate(file.timestamp)}</div>
                        </div>
                        <div class="file-actions">
                            <button class="btn-small" onclick="openItem(${file.id})">Decrypt & View</button>
                            <button class="btn-small btn-danger" onclick="deleteItem(${file.id})">Delete</button>
                        </div>
                    `;
                    fileList.appendChild(fileEl);
                });
            }
            
            if (messages.length === 0) {
                messageList.innerHTML = '<p style="color: #666;">No encrypted messages stored yet.</p>';
            } else {
                messages.forEach(msg => {
                    const msgEl = document.createElement('div');
                    msgEl.className = 'message-item';
                    msgEl.innerHTML = `
                        <div class="message-info">
                            <div class="message-title">💬 ${msg.title}</div>
                            <div class="message-meta">${formatDate(msg.timestamp)}</div>
                        </div>
                        <div class="message-actions">
                            <button class="btn-small" onclick="openItem(${msg.id})">Decrypt & Read</button>
                            <button class="btn-small btn-danger" onclick="deleteItem(${msg.id})">Delete</button>
                        </div>
                    `;
                    messageList.appendChild(msgEl);
                });
            }
        }

        // Open Item (show passphrase modal)
        function openItem(id) {
            const items = JSON.parse(localStorage.getItem('encryptedItems') || '[]');
            currentItem = items.find(i => i.id === id);
            document.getElementById('passphraseModal').classList.add('active');
            document.getElementById('modalPassphrase').value = '';
            document.getElementById('modalError').textContent = '';
        }

        // Decrypt Item
        async function decryptItem() {
            const passphrase = document.getElementById('modalPassphrase').value;
            const errorEl = document.getElementById('modalError');
            
            if (!passphrase) {
                errorEl.textContent = 'Please enter the passphrase';
                return;
            }
            
            try {
                const decrypted = await decryptData(currentItem.encryptedData, passphrase);
                
                if (currentItem.type === 'file') {
                    // Download file
                    const link = document.createElement('a');
                    link.href = decrypted;
                    link.download = currentItem.name;
                    link.click();
                } else {
                    // Show message
                    alert('Message: ' + currentItem.title + '\n\n' + decrypted);
                }
                
                closeModal();
            } catch (err) {
                errorEl.textContent = 'Incorrect passphrase or decryption error';
            }
        }

        // Close Modal
        function closeModal() {
            document.getElementById('passphraseModal').classList.remove('active');
            currentItem = null;
        }

        // Delete Item
        function deleteItem(id) {
            if (confirm('Are you sure you want to delete this item?')) {
                let items = JSON.parse(localStorage.getItem('encryptedItems') || '[]');
                items = items.filter(i => i.id !== id);
                localStorage.setItem('encryptedItems', JSON.stringify(items));
                loadItems();
            }
        }

        // Utility Functions
        function formatBytes(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
        }

        function formatDate(timestamp) {
            const date = new Date(timestamp);
            return date.toLocaleDateString() + ' ' + date.toLocaleTimeString();
        }

        // Initialize on load
        init();
    </script>
</body>
</html>
